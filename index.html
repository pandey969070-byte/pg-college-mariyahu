<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>PG College Mariyahu</h1>
    <p>Student Login Portal</p>

    <nav>
        <a href="index.html">Page 1</a>
        <a href="register.html">Page 2</a>
        <a href="home.html">Page 3</a>
    </nav>
</header>

<div class="form-box">
    <h2>Student Login</h2>

    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail"
        placeholder="Enter Email Id" required>

        <label>Roll Number</label>
        <input type="text" id="loginRoll"
        placeholder="Enter Roll Number" required>

        <label>Password</label>
        <input type="password" id="loginPassword"
        placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New Student?
    <a href="register.html">Register Here</a></p>
</div>

<footer>
    © 2026 PG College Mariyahu Jaunpur
</footer>

<script src="script.js"></script>
</body>
</html>
